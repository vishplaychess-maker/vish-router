name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails if package.json and package-lock.json disagree, which is
      # exactly the check we want on every change to dependencies.
      - name: Install dependencies
        run: npm ci

      # Boots the real gateway as a child process against mock providers and
      # drives the full matrix: routing, equivalence, failover, streaming and
      # every error path. Needs no API keys.
      - name: Smoke test (mock providers, no keys required)
        run: npm run smoke

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this fails the job on any
      # TypeScript error. Note: `npm run dev` transpiles WITHOUT typechecking,
      # so this step is the only place type errors get caught.
      - name: Typecheck and build
        run: npm run build
